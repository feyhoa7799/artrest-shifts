server {
    server_name podrabotka.art-rest.com;

    location / {
        default_type text/plain;
        add_header Retry-After 600 always;
        return 503 "Технические работы. Пожалуйста, попробуйте снова через несколько минут.\n";
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/podrabotka.art-rest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podrabotka.art-rest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = podrabotka.art-rest.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name podrabotka.art-rest.com;
    return 404;
}
