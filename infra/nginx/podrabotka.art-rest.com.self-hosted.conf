server {
    server_name podrabotka.art-rest.com;

    # Sensitive Auth operations stay behind application routes that validate
    # Yandex SmartCaptcha. These rules prevent direct public bypasses.
    location = /supabase/auth/v1/otp {
        return 404;
    }

    location = /supabase/auth/v1/recover {
        return 404;
    }

    location = /supabase/auth/v1/signup {
        return 404;
    }

    location = /supabase/auth/v1/admin {
        return 404;
    }

    location ^~ /supabase/auth/v1/admin/ {
        return 404;
    }

    location = /supabase/auth/v1/token {
        # Browser clients need refresh_token. Password login and every other
        # grant remain server-side behind SmartCaptcha.
        if ($arg_grant_type != refresh_token) {
            return 404;
        }

        proxy_pass http://127.0.0.1:54321/auth/v1/token;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /supabase;
    }

    location ^~ /supabase/ {
        proxy_pass http://127.0.0.1:54321/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /supabase;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Ssl on;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/podrabotka.art-rest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/podrabotka.art-rest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = podrabotka.art-rest.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name podrabotka.art-rest.com;
    return 404;
}
